<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>zCoin Evidence Auditor</title><style>body{font-family:system-ui;background:#111;color:#eee;margin:0}main{max-width:1000px;margin:auto;padding:24px}.card{background:#1d1d1d;padding:18px;border-radius:14px;margin:16px 0}input,select,button{padding:10px;margin:6px 4px 6px 0}pre{white-space:pre-wrap;background:#090909;padding:16px;border-radius:10px;overflow:auto}</style></head><body><main><h1>zCoin CoinFlip Evidence Auditor</h1><p>ตรวจ verifier, revealed-seed commitment, nonce และ statistical bias จากข้อมูลประวัติ โดยไม่มี live betting automation</p><div class="card"><h2>Upload CSV</h2><form id="u"><input name="dataset" placeholder="dataset" required><select name="algorithm"><option>new</option><option>old</option></select><input name="file" type="file" accept=".csv" required><button>Ingest</button></form><pre id="uo"></pre></div><div class="card"><h2>Analyze</h2><input id="d" placeholder="dataset"><button data-p="analysis">Core</button><button data-p="advanced">Advanced</button><button data-p="evidence">Evidence</button><button data-p="paper/compare">Paper compare</button><button id="r">HTML report</button><pre id="o"></pre></div><div class="card"><b>Scope:</b> historical verification, evidence analysis and paper simulation only.</div></main><script>const $=s=>document.querySelector(s);$('#u').onsubmit=async e=>{e.preventDefault();let x=await fetch('/api/ingest',{method:'POST',body:new FormData(e.target)});$('#uo').textContent=JSON.stringify(await x.json(),null,2)};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{let x=await fetch('/api/'+b.dataset.p+'/'+encodeURIComponent($('#d').value));$('#o').textContent=JSON.stringify(await x.json(),null,2)});$('#r').onclick=()=>window.open('/report/'+encodeURIComponent($('#d').value),'_blank');</script></body></html>
