name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: PYTHONPATH=. pytest -q
      - run: docker build -t zcoin:${GITHUB_REF_NAME} .
      - name: Build source artifact
        run: |
          NAME="zcoin-${GITHUB_REF_NAME}"
          zip -r "${NAME}.zip" . -x '.git/*' 'data/*.db' 'data/*.sqlite*' '*/__pycache__/*' '.pytest_cache/*'
          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            zcoin-${{ github.ref_name }}.zip
            zcoin-${{ github.ref_name }}.zip.sha256
