name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: PYTHONPATH=. pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config >/dev/null
      - run: docker compose -f docker-compose.prod.yml config >/dev/null
      - run: docker build -t zcoin:${{ github.sha }} .

  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject common secret-bearing files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi
      - name: Guard audit-only scope
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEi '(place[_ -]?bet|auto[_ -]?bet|wager[_ -]?endpoint|session[_ -]?cookie)' -- '*.py' '*.js' '*.ts' ':!tests/*'; then
            echo 'Review required: live/account betting automation marker found.'
            exit 1
          fi
